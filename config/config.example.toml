# Each user gets an independent config at ~/.config/hpc-mcp/config.toml.
[filesystem]
roots = ["~/work"]

[permissions]
enable_writes = false
enable_commands = false
# Generic mutation tools: opt in separately after reviewing scheduler policy.
enable_scheduler_submit = false
enable_scheduler_cancel = false
enable_site_tools = false
# Legacy Slurm setting remains accepted for older installations:
# enable_slurm_submit = false

[commands]
# This is a basename allowlist, not a sandbox. See docs/security.md.
# Review a build-specific allowlist before enabling enable_commands:
# allowlist = ["hostname", "whoami", "pwd", "date", "uptime",
#              "cmake", "make", "ninja", "ctest", "gcc", "g++", "gfortran",
#              "icx", "icpx", "ifx", "mpicc", "mpicxx", "mpifort", "mpiexec"]
allowlist = ["hostname", "whoami", "pwd", "date", "uptime"]
# Only these variable names may be overridden for an individual invocation.
# Leave empty for strict least privilege.
env_allowlist = []
# For OpenMP and Intel MPI jobs after reviewing the site's policy:
# env_allowlist = ["OMP_NUM_THREADS", "OMP_PROC_BIND", "OMP_PLACES",
#                  "MKL_NUM_THREADS", "I_MPI_COLL_EXTERNAL", "I_MPI_FABRICS"]

[scheduler]
# Options: "slurm", "pbs" or "none". Default is "slurm" for compatibility.
type = "slurm"
# Set for scheduler binaries missing from the Tunnel service PATH.
# Example: bin_dir = "/opt/slurm/bin"
bin_dir = ""

# Site-specific, fixed-argument read-only enquiries (optional):
# [site_tools.point_balance]
# description = "Check remaining compute points"
# argv = ["/absolute/path/to/point"]
# read_only = true
# cwd = "~/work"
# timeout_seconds = 10

[limits]
max_file_bytes = 2097152
max_output_chars = 16000
command_timeout_seconds = 30
max_background_sessions = 4
# MCP File Manager is an OPTIONAL package installed into this server's .venv.
# See docs/file_manager.md and docs/upgrading.md for installation / upgrade.
# Older [extensions.file_viewer] enabled=true is accepted as a fallback.
[extensions.file_manager]
enabled = false
# Editing additionally requires [permissions].enable_writes = true.
enable_edit = false
