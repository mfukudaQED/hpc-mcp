[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-mcp"
version = "0.3.0"
description = "Per-user, least-privilege MCP tools for Linux HPC clusters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hpc-mcp = "hpc_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
